name: Build and Test
on:
  push:
    branches: [main, pg16-wheels, pg-16-17-18]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  PIP_DISABLE_PIP_VERSION_CHECK: '1'
  # Build AND test against the glibc 2.28 baseline.
  MANYLINUX_IMAGE: quay.io/pypa/manylinux_2_28_x86_64:latest

jobs:
  launcher:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.12'
      - run: python -m pip install build
      - run: python -m build --wheel
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: launcher
          path: dist/*.whl
          if-no-files-found: error

  binaries:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.12'
      - name: Build and audit Linux wheel
        if: runner.os == 'Linux'
        run: |
          docker run --rm -v "$PWD:/io" -w /io "$MANYLINUX_IMAGE" bash -euxo pipefail -c '
            export PATH=/opt/python/cp312-cp312/bin:$PATH
            python -m pip install build auditwheel patchelf
            make -C packages/pgserver-postgres-16 build JOBS=4
            python -m build --wheel --outdir raw-wheels packages/pgserver-postgres-16
            auditwheel repair --plat manylinux_2_28_x86_64 --only-plat -w dist raw-wheels/*.whl
            auditwheel show dist/*.whl
            test "$(basename dist/*.whl)" = pgserver_postgres_16-0.2.0-py3-none-manylinux_2_28_x86_64.whl
          '
      - name: Build and audit macOS wheel
        if: runner.os == 'macOS'
        env:
          MACOSX_DEPLOYMENT_TARGET: '11.0'
        run: |
          test "$(uname -m)" = arm64
          python -m pip install build delocate
          make -C packages/pgserver-postgres-16 build JOBS=4
          python -m build --wheel --outdir dist packages/pgserver-postgres-16
          delocate-wheel --require-archs arm64 -v dist/*.whl
          test "$(basename dist/*.whl)" = pgserver_postgres_16-0.2.0-py3-none-macosx_11_0_arm64.whl
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: binary-${{ matrix.os }}
          path: dist/*.whl
          if-no-files-found: error

  test:
    needs: [launcher, binaries]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
        python: ['3.12', '3.13', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: launcher
          path: wheelhouse
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: binary-${{ matrix.os }}
          path: wheelhouse
      - name: Test Linux installed wheels as an unprivileged user
        if: runner.os == 'Linux'
        env:
          PYTHON_VERSION: ${{ matrix.python }}
        run: |
          abi="cp${PYTHON_VERSION//./}"
          docker run --rm --init -v "$PWD:/io" -w /io -e PYTHON_ABI="$abi" "$MANYLINUX_IMAGE" \
            bash /io/scripts/ci_test_unprivileged.sh
      - name: Test macOS installed wheels
        if: runner.os == 'macOS'
        run: |
          python scripts/install_wheels.py wheelhouse
          python -m pip install pytest pytest-xdist pytest-timeout 'psycopg[binary]>=3.2' psycopg2-binary 'sqlalchemy>=2' sqlalchemy-utils
          python -m pytest --ignore=tests/test_xdist.py -q
          python -m pytest -n 2 --dist each tests/test_xdist.py -q

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: launcher
          path: dist
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: binary-*
          path: dist
          merge-multiple: true
      - name: Publish wheels and checksums to GitHub Releases
        working-directory: dist
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          sha256sum *.whl > SHA256SUMS
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag --title "$RELEASE_TAG" --generate-notes --draft
          fi
          gh release upload "$RELEASE_TAG" ./*.whl SHA256SUMS
          gh release edit "$RELEASE_TAG" --draft=false
